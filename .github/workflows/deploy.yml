name: Deploy VitePress site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ⚠️ 学习 JSON 只在本地机器,runner 上没有 → 必须 fail-fast,禁止生成空壳站覆盖真站
      - name: Verify study data exists (fail-fast)
        run: |
          if [ ! -d /home/openclaw/.hermes/study ]; then
            echo "❌ 学习数据不存在(runner 无本地数据)。此 workflow 只在本地数据可达时才可运行。"
            echo "真实部署请走 cron: ./scripts/build.sh deploy (本地构建 force-push gh-pages)"
            exit 1
          fi

      - name: Generate site markdown
        run: python3 scripts/generate_site.py

      - name: Build
        run: pnpm install --frozen-lockfile && pnpm docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4